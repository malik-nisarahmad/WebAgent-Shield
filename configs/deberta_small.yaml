model_name: microsoft/deberta-v3-small

max_length: 512
stride: 384

learning_rate: 0.00002
num_train_epochs: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
gradient_accumulation_steps: 4
weight_decay: 0.01
warmup_ratio: 0.1

fp16: true
gradient_checkpointing: true
seed: 42

label2id:
  SAFE: 0
  INJECTION: 1

id2label:
  0: SAFE
  1: INJECTION
