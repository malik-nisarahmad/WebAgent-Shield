[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webagent-shield"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "playwright>=1.48,<2", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
research = [
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "scikit-learn>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
cache_dir = "artifacts/pytest-cache"
